name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A PR that gets pushed twice in quick succession only needs the latest run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 24 is what release.yml publishes with; 20 is the floor that keeps
        # package.json's `engines.node: >=18` claim honest.
        node: [20, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # docs-sync.test.ts asserts server.json's version and name match
      # package.json. The MCP registry rejects a publish outright when they
      # disagree, and bumpp only touches package.json — so this test is the
      # only thing standing between a version bump and a failed release.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
