name: Release

on:
  push:
    tags:
      - 'mcp-v*'
  # Finishes a release whose registry step failed after npm had published.
  workflow_dispatch:

jobs:
  release:
    name: Build and Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Skips when the version is already on npm, so a re-run can finish the
      # registry step without failing on "cannot publish over existing version".
      - name: Publish to npm
        run: |
          VERSION=$(jq -r .version package.json)
          if npm view "@gaffer-sh/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "@gaffer-sh/mcp@$VERSION is already on npm, skipping publish"
          else
            pnpm publish --access public --no-git-checks --provenance
          fi

      # npm accepts a publish and then processes it; the version is not served
      # for a minute or two. The MCP Registry checks npm, so wait for it.
      - name: Wait for npm to serve the version
        run: |
          VERSION=$(jq -r .version package.json)
          for attempt in $(seq 1 40); do
            if npm view "@gaffer-sh/mcp@$VERSION" version >/dev/null 2>&1; then
              echo "npm serves $VERSION"
              exit 0
            fi
            echo "waiting for npm to serve $VERSION (attempt $attempt)"
            sleep 15
          done
          echo "::error::npm did not serve @gaffer-sh/mcp@$VERSION within 10 minutes"
          exit 1

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      ### Publish MCP server:

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # `sh.gaffer/mcp` is a domain namespace, so the registry requires proof of
      # control over gaffer.sh. GitHub OIDC only ever grants `io.github.*`.
      # Proof record lives on the gaffer.sh apex: v=MCPv1; k=ed25519; p=<pubkey>
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login dns --domain gaffer.sh --private-key "$MCP_PRIVATE_KEY"
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}

      # package.json is the source of truth (bumpp bumps it); the tag name is
      # `mcp-v*`, not `v*`, so parsing GITHUB_REF here would be wrong.
      - name: Sync version into server.json
        run: |
          VERSION=$(jq -r .version package.json)
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.tmp
          mv server.tmp server.json

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
